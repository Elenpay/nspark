name: Native build (spark_frost from pinned Lightspark source)

# Rebuilds libspark_frost from buildonspark/spark at a PINNED commit, on native runners, and
# checks it against the committed C# bindings. The output is the runtimes/ tree to commit under
# src/NSpark/runtimes/, plus SHA256SUMS.txt and build-provenance attestations.
#
# - Linux RIDs build inside Amazon Linux 2023 (glibc 2.34) so the library loads on the AWS
#   Lambda dotnet runtime and on every newer distro.
# - The build logic lives in scripts/build-native.sh so it can be reproduced locally.
# - Bump SPARK_SHA (and the protos re-vendored from the same commit) in one PR.
#
# Supported RIDs: linux-x64, linux-arm64, osx-arm64. Other RIDs are not shipped.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SPARK_REPO: buildonspark/spark
  SPARK_SHA: 0b3a32a05c9ac06cc411683551dd1f1bde9d0caa
  AL2023_IMAGE: amazonlinux:2023@sha256:5b29412077a463b4a3a8fbc99a8cdf4b929f38a3ecc8dac10328d8f36b0099b8
  UNIFFI_BINDGEN_CS_TAG: v0.9.2+v0.28.3

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64,   os: ubuntu-24.04 }
          - { rid: linux-arm64, os: ubuntu-24.04-arm }
          - { rid: osx-arm64,   os: macos-14 }
    steps:
      - uses: actions/checkout@v4
        with:
          path: nspark

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SPARK_REPO }}
          ref: ${{ env.SPARK_SHA }}
          path: spark

      - name: Build (Amazon Linux 2023 container)
        if: runner.os == 'Linux'
        run: |
          docker run --rm \
            -v "$PWD/spark:/spark:ro" -v "$PWD/nspark/scripts:/scripts:ro" -v "$PWD/out:/out" \
            "$AL2023_IMAGE" bash /scripts/build-native.sh ${{ matrix.rid }} /spark /out

      - name: Build (native macOS)
        if: runner.os == 'macOS'
        run: nspark/scripts/build-native.sh ${{ matrix.rid }} spark out

      - name: Bindings match the committed SparkFrostBindings.cs
        if: matrix.rid == 'linux-x64'
        run: |
          cargo install uniffi-bindgen-cs --git https://github.com/NordSecurity/uniffi-bindgen-cs \
            --tag "$UNIFFI_BINDGEN_CS_TAG" --locked --root "$RUNNER_TEMP/bindgen"
          "$RUNNER_TEMP/bindgen/bin/uniffi-bindgen-cs" spark/signer/spark-frost-uniffi/src/spark_frost.udl \
            --lib-file out/runtimes/linux-x64/native/libspark_frost.so --out-dir "$RUNNER_TEMP/gen"
          diff -u nspark/src/NSpark/Signer/SparkFrostBindings.cs "$RUNNER_TEMP/gen/spark_frost.cs"

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: out/runtimes/
          if-no-files-found: error

  consolidate:
    name: SHA256SUMS + provenance
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: runtimes
          merge-multiple: true

      - name: SHA256SUMS.txt
        run: |
          cd runtimes
          find . -type f \( -name "*.so" -o -name "*.dylib" \) | sort | xargs sha256sum | sed 's|  \./|  |' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            runtimes/**/*.so
            runtimes/**/*.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: runtimes
          path: runtimes/
          if-no-files-found: error
